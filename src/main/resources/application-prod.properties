# Activated with SPRING_PROFILES_ACTIVE=prod (set in the Dockerfile).

# Session cookie is only sent over HTTPS and is hidden from JavaScript.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Render terminates TLS at its proxy; trust X-Forwarded-* so the app sees requests as HTTPS
# (correct redirect URLs and secure-request detection).
server.forward-headers-strategy=native
