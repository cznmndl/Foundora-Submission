# Render (and most hosts) assign the port through PORT.
server.port=${PORT:8080}

# Local development: secrets are read from a git-ignored .env file in the working directory.
# Real environment variables (e.g. on Render) take precedence over it. See .env.example.
spring.config.import=optional:file:.env[.properties]

# Supabase Postgres through the Session pooler. No defaults: the app fails fast if these are missing.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
# The Session pooler caps client connections per project, so keep the pool small.
spring.datasource.hikari.maximum-pool-size=3
# Always use TLS to Supabase. The driver's default (prefer) silently falls back to plaintext.
spring.datasource.hikari.data-source-properties.sslmode=require
# Flyway (db/migration) owns the schema; Hibernate only checks that it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
# Keep Flyway's history table in its own schema, out of the public schema that Supabase's Data API exposes.
# Migrations therefore name public.* explicitly.
spring.flyway.default-schema=flyway
spring.flyway.schemas=flyway
# Ride out brief network failures at startup instead of crashing (backs off 1s, 2s, 4s, ...).
spring.flyway.connect-retries=5
spring.jpa.open-in-view=false

# Supabase Storage for item photos, uploaded from the server with the secret key.
foundora.supabase.url=${SUPABASE_URL}
foundora.supabase.secret-key=${SUPABASE_SECRET_KEY}
foundora.supabase.bucket=item-images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Dates ("today", "2 hours ago") use the school's time zone; Render's servers run in UTC.
foundora.time-zone=Asia/Manila
# How often the in-memory feed index reloads from the database (it also updates on every admin action).
foundora.feed.rebuild-interval=PT5M
# SDFO office details shown beside the feed.
foundora.sdfo.room=MB 3rd Floor
# (\u2013 is an en dash; .properties files are read as ISO-8859-1.)
foundora.sdfo.hours=8:00 AM \u2013 4:00 PM
# Accounts whose comments get the "SDFO" badge (they should also be on FOUNDORA_ADMIN_EMAILS to moderate).
foundora.sdfo.emails=sdfo@dlsl.edu.ph

# The report form's location dropdown, in this order. "Other" is always added last.
# Locations are shown only to admins (and to reporters on My Reports), never on the feed.
foundora.campus-locations=Mabini Building (MB),Sports Complex,Sentrum,Oval,Chez Rafael Canteen,Diokno Building,\
  South Lounge,North Lounge,IT Domain,Gazebo,Student Center (SC),CBEAM Building,CBEAM Grounds,JRN,JRF

# Course dropdown on the profile form. "Other" is always added last (the student then types the program).
# PLACEHOLDER list: replace with DLSL's official program names.
foundora.profile.courses=BS Information Technology,BS Computer Science,BS Computer Engineering,\
  BS Electrical Engineering,BS Electronics Engineering,BS Civil Engineering,BS Industrial Engineering,\
  BS Mechanical Engineering,BS Accountancy,BS Business Administration,BS Hospitality Management,\
  BS Tourism Management,BS Psychology,BS Nursing,AB Communication,BS Education

# Comments: minimum time between two comments from the same person (spam protection).
foundora.comments.cooldown=PT30S

# Claimed reports are archived this long after they're marked as claimed (ISO-8601 duration; P30D = 30 days),
# checked every foundora.claims.archive-check-interval.
foundora.claims.archive-after=P30D
foundora.claims.archive-check-interval=PT1H
# How long a verified claim's pickup pass lasts; after that the item is back on the feed as unclaimed.
# Admins can extend a pass by another period. Expired passes are checked every archive-check-interval.
foundora.claims.pass-valid-for=P7D

# Firebase Admin SDK (server-side ID token verification only).
# The service account key is a secret: keep it out of version control.
# FIREBASE_CREDENTIALS_PATH is a filesystem path to the key; when unset, the app falls back to
# src/main/resources/firebase-service-account.json on the classpath (local development only).
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.project.id=foundora-26

# Firebase web config for the Google sign-in page. These values are public by design.
firebase.web.api-key=AIzaSyD7EWQZmMOnVkhzMnOdWYkak11AnTnfzbM
firebase.web.auth-domain=foundora-26.firebaseapp.com
firebase.web.project-id=foundora-26
firebase.web.app-id=1:603285580927:web:f09a42339685bd925ea34a

# Comma-separated @dlsl.edu.ph addresses allowed into /admin (any format, including first_last and office accounts).
# Set FOUNDORA_ADMIN_EMAILS in production; the value after the colon is the local-dev default.
foundora.auth.admin-emails=${FOUNDORA_ADMIN_EMAILS:dnase.jiana.czien.tura@dlsl.edu.ph}

