# Render (and most hosts) assign the port through PORT.
server.port=${PORT:8080}

# Local development: secrets are read from a git-ignored .env file in the working directory.
# Real environment variables (e.g. on Render) take precedence over it. See .env.example.
spring.config.import=optional:file:.env[.properties]

# Supabase Postgres through the Session pooler. No defaults: the app fails fast if these are missing.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
# The Session pooler caps client connections per project, so keep the pool small.
spring.datasource.hikari.maximum-pool-size=5
# Flyway (db/migration) owns the schema; Hibernate only checks that it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
# Keep Flyway's history table in its own schema, out of the public schema that Supabase's Data API exposes.
# Migrations therefore name public.* explicitly.
spring.flyway.default-schema=flyway
spring.flyway.schemas=flyway
spring.jpa.open-in-view=false

# Supabase Storage for item photos, uploaded from the server with the secret key.
foundora.supabase.url=${SUPABASE_URL}
foundora.supabase.secret-key=${SUPABASE_SECRET_KEY}
foundora.supabase.bucket=item-images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Firebase Admin SDK (server-side ID token verification only).
# The service account key is a secret: keep it out of version control.
# FIREBASE_CREDENTIALS_PATH is a filesystem path to the key; when unset, the app falls back to
# src/main/resources/firebase-service-account.json on the classpath (local development only).
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.project.id=foundora-26

# Firebase web config for the Google sign-in page. These values are public by design.
firebase.web.api-key=AIzaSyD7EWQZmMOnVkhzMnOdWYkak11AnTnfzbM
firebase.web.auth-domain=foundora-26.firebaseapp.com
firebase.web.project-id=foundora-26
firebase.web.app-id=1:603285580927:web:f09a42339685bd925ea34a

# Comma-separated first.last@dlsl.edu.ph addresses allowed into /admin.
# Set FOUNDORA_ADMIN_EMAILS in production; the value after the colon is the local-dev default.
foundora.auth.admin-emails=${FOUNDORA_ADMIN_EMAILS:dnase.jiana.czien.tura@dlsl.edu.ph}

server.servlet.session.cookie.same-site=lax
