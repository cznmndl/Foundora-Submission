<!DOCTYPE html>
<!-- Fixed notices shown on several pages. Edit the wording here and every page that uses it changes. -->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Usage: ~{fragments/notices :: sdfoHandover}. Shown at the top of every comment section. -->
<div th:fragment="sdfoHandover" class="alert alert-info" role="note">
    <th:block th:replace="~{fragments/icons :: icon('info')}"></th:block>
    <p class="small"><strong>Reminder:</strong> Items must be turned over to and claimed through the SDFO. Private handovers are not officially recognized.</p>
</div>
</body>
</html>
