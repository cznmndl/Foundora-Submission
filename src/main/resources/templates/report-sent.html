<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::#content}, ~{}, ~{})}">
<head><title>Report sent · Foundora</title></head>
<body>
<div id="content" class="content-narrow">
    <section class="card empty">
        <div class="empty-icon" th:insert="~{fragments/icons :: icon('check')}"></div>
        <h1>Your report was sent!</h1>
        <p class="lead">It will appear on the feed once an admin approves it. You can follow it on My Reports.</p>
        <p class="sdfo-note" style="justify-content:center" th:if="${sentType != null and sentType.name() == 'FOUND'}">
            <th:block th:replace="~{fragments/icons :: icon('info')}"></th:block>
            <span>Please bring the item to the SDFO office.</span>
        </p>
        <div class="action-row" style="justify-content:center; margin-top:1rem">
            <a class="btn btn-primary" th:href="@{/my-reports}">See My Reports</a>
            <a class="btn btn-secondary" th:href="@{/}">Back to the feed</a>
        </div>
    </section>
</div>
</body>
</html>
