<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foundora - Lost and Found Management</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <header class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600">Foundora</h1>
            <div class="flex items-center">
                <input type="text" placeholder="Search..." class="border border-gray-300 rounded-lg p-2 mr-4">
                <a href="/report" class="bg-blue-600 text-white px-4 py-2 rounded-lg">+ Report Item</a>
                <span th:if="${currentUser}" class="text-gray-600 ml-4" th:text="${currentUser.email}"></span>
                <form th:action="@{/logout}" method="post" class="ml-4">
                    <button type="submit" class="text-gray-700 hover:underline">Sign out</button>
                </form>
            </div>
        </div>
    </header>
    <div class="flex">
        <aside class="w-1/4 bg-white p-4 shadow">
            <h2 class="font-bold text-lg mb-4">Filters</h2>
            <h3 class="font-semibold">Status</h3>
            <ul>
                <li><a href="?status=all" class="block py-1">All</a></li>
                <li><a href="?status=lost" class="block py-1">Lost</a></li>
                <li><a href="?status=found" class="block py-1">Found</a></li>
            </ul>
            <h3 class="font-semibold mt-4">Categories</h3>
            <ul>
                <li><a href="?category=electronics" class="block py-1">Electronics</a></li>
                <li><a href="?category=ids" class="block py-1">IDs</a></li>
                <li><a href="?category=tumblers" class="block py-1">Tumblers</a></li>
                <li><a href="?category=umbrellas" class="block py-1">Umbrellas</a></li>
                <li><a href="?category=school_supplies" class="block py-1">School Supplies</a></li>
                <li><a href="?category=personal_belongings" class="block py-1">Personal Belongings</a></li>
            </ul>
        </aside>
        <main class="w-3/4 p-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <th:block th:each="item : ${items}">
                    <div class="bg-white rounded-lg shadow p-4">
                        <img th:if="${item.imageUrl}" th:src="${item.imageUrl}" alt="Item Image" class="w-full h-32 object-cover rounded">
                        <h3 class="font-bold text-lg mt-2" th:text="${item.title}"></h3>
                        <p class="text-gray-600" th:text="${item.location}"></p>
                        <p class="text-gray-500" th:text="${item.dateLostFound}"></p>
                        <span class="inline-block mt-2 px-2 py-1 text-xs font-semibold rounded-full" 
                              th:class="${item.status == 'LOST' ? 'bg-red-500 text-white' : 'bg-green-500 text-white'}" 
                              th:text="${item.status}"></span>
                        <a href="#" class="text-blue-600 mt-2 block" th:href="@{/item/{id}(id=${item.id})}">View Details</a>
                    </div>
                </th:block>
            </div>
        </main>
    </div>
</body>
</html>
