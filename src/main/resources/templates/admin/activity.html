<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::#content}, ~{}, ~{})}">
<head><title>Activity log · Foundora</title></head>
<body>
<div id="content" class="content-narrow">
    <div class="page-head"><h1>Activity log</h1></div>
    <p class="lead">Who did what to which report, newest first.</p>

    <div class="log-filters">
        <nav class="log-tabs" aria-label="Filter by category">
            <a class="chip" th:href="@{/admin/activity}" th:attr="aria-current=${group == null} ? 'true' : null">All</a>
            <a class="chip" th:each="g : ${groups}" th:href="@{/admin/activity(group=${g.slug()})}" th:text="${g.label()}"
               th:attr="aria-current=${group == g} ? 'true' : null">Reports</a>
        </nav>
        <!--/* Works without JavaScript: a GET form with Apply. app.js applies on change and hides the button. */-->
        <form class="log-action" method="get" th:action="@{/admin/activity}" data-autosubmit>
            <input type="hidden" name="group" th:if="${group != null}" th:value="${group.slug()}">
            <label for="action" class="visually-hidden">Action</label>
            <select id="action" name="action">
                <option value="">Any action</option>
                <th:block th:if="${group != null}">
                    <option th:each="a : ${group.actions()}" th:value="${a.slug()}" th:text="${a.filterLabel()}"
                            th:selected="${action == a}">Submitted</option>
                </th:block>
                <th:block th:if="${group == null}">
                    <optgroup th:each="g : ${groups}" th:label="${g.label()}">
                        <option th:each="a : ${g.actions()}" th:value="${a.slug()}" th:text="${a.filterLabel()}"
                                th:selected="${action == a}">Submitted</option>
                    </optgroup>
                </th:block>
            </select>
            <button class="btn btn-secondary btn-small" type="submit" data-autosubmit-button>Apply</button>
        </form>
    </div>

    <section class="card">
        <p class="muted" th:if="${entries.totalElements == 0}">No activity yet.</p>
        <ol class="atl" th:if="${entries.totalElements > 0}">
            <th:block th:each="e : ${entries.content}"><li th:replace="~{admin/activity :: entry(${e})}"></li></th:block>
        </ol>
        <nav class="pager" aria-label="Pages" th:if="${entries.totalPages > 1}">
            <a class="btn btn-secondary btn-small" th:if="${entries.hasPrevious()}"
               th:href="${newerUrl}">← Newer</a>
            <span class="muted small" th:text="|Page ${entries.number + 1} of ${entries.totalPages}|">Page 1</span>
            <a class="btn btn-secondary btn-small" th:if="${entries.hasNext()}"
               th:href="${olderUrl}">Older →</a>
        </nav>
    </section>
</div>

<!--/* One activity entry: the status badge in its fixed column, then who did what to which report. */-->
<li th:fragment="entry(e)">
    <span th:replace="~{fragments/status :: badge(${e.action.name()})}"></span>
    <div class="atl-entry">
        <div>
            <span class="atl-who" th:text="${e.actorName}">Admin</span>
            <span class="atl-email" th:if="${e.actorEmail != 'system'}" th:text="|(${e.actorEmail})|">email</span>
            <span th:text="${e.action.name() == 'SUBMITTED'} ? ' submitted' : ''"></span>
            <a th:if="${e.itemId != null}" th:href="@{/posts/{id}(id=${e.itemId})}" th:text="|“${e.itemName}”|">“Item”</a>
            <span th:unless="${e.itemId != null}" th:text="|“${e.itemName}”|">“Item”</span>
        </div>
        <div class="atl-note" th:if="${e.reason != null}" th:text="|Note: ${e.reason}|">Note</div>
        <time class="atl-when" th:datetime="${@fmt.iso(e.createdAt)}" th:text="${@fmt.dateTime(e.createdAt)}">time</time>
    </div>
</li>
</body>
</html>
