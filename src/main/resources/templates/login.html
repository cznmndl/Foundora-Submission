<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Foundora</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <meta name="theme-color" content="#0b6b3a">
</head>
<body style="padding-bottom:0">
<main class="center-page">
    <div class="card center-card">
        <div class="brand">
            <span class="brand-mark" th:insert="~{fragments/icons :: icon('search')}"></span>
            <span>Foundora</span>
        </div>
        <h1>Lost something? Found something?</h1>
        <p class="lead">The lost and found board for the De La Salle Lipa community.</p>
        <p class="muted small">
            Sign in with your <strong th:text="'@' + ${allowedDomain}">@dlsl.edu.ph</strong> Google account.
        </p>
        <div th:if="${param.logout}" class="alert alert-success" role="status">You have been signed out.</div>
        <div id="login-error" class="alert alert-error" role="alert" hidden></div>
        <button id="google-sign-in" type="button" class="btn btn-primary btn-block">Sign in with Google</button>
    </div>
</main>

    <div id="firebase-config" hidden
         th:data-api-key="${firebase.apiKey}"
         th:data-auth-domain="${firebase.authDomain}"
         th:data-project-id="${firebase.projectId}"
         th:data-app-id="${firebase.appId}"
         th:data-hosted-domain="${allowedDomain}"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import {
            getAuth, GoogleAuthProvider, inMemoryPersistence, setPersistence, signInWithPopup, signOut
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const cfg = document.getElementById("firebase-config").dataset;
        const app = initializeApp({
            apiKey: cfg.apiKey,
            authDomain: cfg.authDomain,
            projectId: cfg.projectId,
            appId: cfg.appId
        });
        const auth = getAuth(app);
        await setPersistence(auth, inMemoryPersistence);

        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ hd: cfg.hostedDomain, prompt: "select_account" });

        const button = document.getElementById("google-sign-in");
        const errorBox = document.getElementById("login-error");
        const csrfToken = document.querySelector("meta[name=_csrf]").content;
        const csrfHeader = document.querySelector("meta[name=_csrf_header]").content;

        function showError(message) {
            errorBox.textContent = message;
            errorBox.hidden = false;
        }

        button.addEventListener("click", async () => {
            errorBox.hidden = true;
            button.disabled = true;
            button.setAttribute("aria-busy", "true");
            button.textContent = "Signing in…";
            try {
                const credential = await signInWithPopup(auth, provider);
                const idToken = await credential.user.getIdToken();
                await signOut(auth);

                const response = await fetch("/auth/session", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", [csrfHeader]: csrfToken },
                    body: JSON.stringify({ idToken })
                });
                const body = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(body.error || "Sign-in failed. Please try again.");
                }
                window.location.assign(body.redirect);
            } catch (error) {
                if (error.code !== "auth/popup-closed-by-user" && error.code !== "auth/cancelled-popup-request") {
                    showError(error.message);
                }
                button.disabled = false;
                button.removeAttribute("aria-busy");
                button.textContent = "Sign in with Google";
            }
        });
    </script>
</body>
</html>
