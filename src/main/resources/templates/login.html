<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/auth :: page(~{::title}, ~{::#content})}">
<head><title>Sign in · Foundora</title></head>
<body>
<div id="content" class="auth-content">
    <h1 id="auth-title" class="auth-title">From lost to found, all in one place</h1>
    <p class="auth-sub">The lost and found board for the De La Salle Lipa community</p>

    <div th:if="${param.logout}" class="alert alert-success" role="status">You have been signed out.</div>
    <div th:if="${param.pinReset}" class="alert alert-info" role="status">Sign in with Google again to create a new PIN.</div>
    <div id="login-error" class="alert alert-error" role="alert" hidden></div>

    <button id="google-sign-in" type="button" class="btn-auth btn-google">
        <svg class="google-g" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span data-label>Sign in with Google</span>
    </button>
    <p class="auth-note">Sign in with your <span th:text="'@' + ${allowedDomain}">@dlsl.edu.ph</span> Google account</p>

    <div id="firebase-config" hidden
         th:data-api-key="${firebase.apiKey}"
         th:data-auth-domain="${firebase.authDomain}"
         th:data-project-id="${firebase.projectId}"
         th:data-app-id="${firebase.appId}"
         th:data-hosted-domain="${allowedDomain}"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import {
            getAuth, GoogleAuthProvider, inMemoryPersistence, setPersistence, signInWithPopup, signOut
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const cfg = document.getElementById("firebase-config").dataset;
        const app = initializeApp({
            apiKey: cfg.apiKey,
            authDomain: cfg.authDomain,
            projectId: cfg.projectId,
            appId: cfg.appId
        });
        const auth = getAuth(app);
        await setPersistence(auth, inMemoryPersistence);

        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ hd: cfg.hostedDomain, prompt: "select_account" });

        const button = document.getElementById("google-sign-in");
        const label = button.querySelector("[data-label]");
        const errorBox = document.getElementById("login-error");
        const csrfToken = document.querySelector("meta[name=_csrf]").content;
        const csrfHeader = document.querySelector("meta[name=_csrf_header]").content;

        function showError(message) {
            errorBox.textContent = message;
            errorBox.hidden = false;
        }

        button.addEventListener("click", async () => {
            errorBox.hidden = true;
            button.disabled = true;
            button.setAttribute("aria-busy", "true");
            label.textContent = "Signing in…";
            try {
                const credential = await signInWithPopup(auth, provider);
                const idToken = await credential.user.getIdToken();
                await signOut(auth);

                const response = await fetch("/auth/session", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", [csrfHeader]: csrfToken },
                    body: JSON.stringify({ idToken })
                });
                const body = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(body.error || "Sign-in failed. Please try again.");
                }
                window.location.assign(body.redirect);
            } catch (error) {
                if (error.code !== "auth/popup-closed-by-user" && error.code !== "auth/cancelled-popup-request") {
                    showError(error.message);
                }
                button.disabled = false;
                button.removeAttribute("aria-busy");
                label.textContent = "Sign in with Google";
            }
        });
    </script>
</div>
</body>
</html>
