<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* SDFO office details. Values come from foundora.sdfo.* in application.properties; blank ones show a marked placeholder. */-->
<section th:fragment="card" class="card office">
    <h2 class="office-stripe">SDFO office</h2>
    <p class="small">Found items are turned in here, and owners pick them up here.</p>
    <dl>
        <dt>Where</dt>
        <dd th:if="${@sdfo.room() != null}" th:text="${@sdfo.room()}">Room</dd>
        <dd th:unless="${@sdfo.room() != null}"><span class="placeholder">Room to be confirmed (placeholder)</span></dd>
        <dt>Office hours</dt>
        <dd th:if="${@sdfo.hours() != null}" th:text="${@sdfo.hours()}">Hours</dd>
        <dd th:unless="${@sdfo.hours() != null}"><span class="placeholder">Hours to be confirmed (placeholder)</span></dd>
    </dl>
</section>
</body>
</html>
