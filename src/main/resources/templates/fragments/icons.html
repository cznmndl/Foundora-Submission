<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Inline icons (stroke = text colour). Always decorative: the text next to them carries the meaning. -->
<svg th:fragment="icon(name)" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" th:switch="${name}">
    <th:block th:case="'home'"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></th:block>
    <th:block th:case="'plus'"><path d="M12 5v14M5 12h14"/></th:block>
    <th:block th:case="'list'"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></th:block>
    <th:block th:case="'shield'"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></th:block>
    <th:block th:case="'search'"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></th:block>
    <th:block th:case="'logout'"><path d="M15 4h4v16h-4M10 17l5-5-5-5M15 12H3"/></th:block>
    <th:block th:case="'pin'"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></th:block>
    <th:block th:case="'calendar'"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></th:block>
    <th:block th:case="'camera'"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></th:block>
    <th:block th:case="'check'"><path d="M5 12l5 5L20 7"/></th:block>
    <th:block th:case="'info'"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></th:block>
    <th:block th:case="'inbox'"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/></th:block>
    <th:block th:case="'activity'"><path d="M3 12h4l3-8 4 16 3-8h4"/></th:block>
    <th:block th:case="'grid'"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></th:block>
    <th:block th:case="'x'"><path d="M6 6l12 12M18 6L6 18"/></th:block>
    <th:block th:case="'filter'"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></th:block>
    <th:block th:case="'tag'"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></th:block>
    <th:block th:case="'clock'"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></th:block>
    <th:block th:case="*"><circle cx="12" cy="12" r="2"/></th:block>
</svg>
</body>
</html>
