<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Inline icons (stroke = text colour). Always decorative: the text next to them carries the meaning. */-->
<svg th:fragment="icon(name)" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" th:switch="${name}">
    <th:block th:case="'home'"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></th:block>
    <th:block th:case="'plus'"><path d="M12 5v14M5 12h14"/></th:block>
    <th:block th:case="'list'"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></th:block>
    <th:block th:case="'shield'"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></th:block>
    <th:block th:case="'search'"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></th:block>
    <th:block th:case="'logout'"><path d="M15 4h4v16h-4M10 17l5-5-5-5M15 12H3"/></th:block>
    <th:block th:case="'pin'"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></th:block>
    <th:block th:case="'calendar'"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></th:block>
    <th:block th:case="'camera'"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></th:block>
    <th:block th:case="'check'"><path d="M5 12l5 5L20 7"/></th:block>
    <th:block th:case="'info'"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></th:block>
    <th:block th:case="'inbox'"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/></th:block>
    <th:block th:case="'activity'"><path d="M3 12h4l3-8 4 16 3-8h4"/></th:block>
    <th:block th:case="'grid'"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></th:block>
    <th:block th:case="'x'"><path d="M6 6l12 12M18 6L6 18"/></th:block>
    <th:block th:case="'filter'"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></th:block>
    <th:block th:case="'tag'"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></th:block>
    <th:block th:case="'clock'"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></th:block>
    <th:block th:case="'comment'"><path d="M4 5h16v11H9l-5 4z"/></th:block>
    <th:block th:case="'user'"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></th:block>
    <th:block th:case="'archive'"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v11h14V9M10 13h4"/></th:block>
    <th:block th:case="'trash'"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></th:block>
    <th:block th:case="'shield-check'"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></th:block>
    <th:block th:case="'image'"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5L5 20"/></th:block>
    <th:block th:case="'posted'"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></th:block>
    <th:block th:case="'review'"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/></th:block>
    <!--/* Category glyphs, for items without a photo: 'cat-' + Category.name(). */-->
    <th:block th:case="'cat-ELECTRONICS'"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></th:block>
    <th:block th:case="'cat-IDS_DOCUMENTS'"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.6-1.4 1.6-2 3-2s2.4.6 3 2M14 10h4M14 13.5h3"/></th:block>
    <th:block th:case="'cat-TUMBLERS_BOTTLES'"><path d="M9 2.5h6v3l1.5 2.5v12a1.5 1.5 0 01-1.5 1.5H9a1.5 1.5 0 01-1.5-1.5V8L9 5.5z"/><path d="M7.5 11h9"/></th:block>
    <th:block th:case="'cat-UMBRELLAS'"><path d="M3 12a9 9 0 0118 0z"/><path d="M12 12v6.5a2 2 0 01-4 0M12 3v0"/></th:block>
    <th:block th:case="'cat-SCHOOL_SUPPLIES'"><path d="M16.5 3.5l4 4L8 20H4v-4z"/><path d="M14 6l4 4"/></th:block>
    <th:block th:case="'cat-BAGS_WALLETS'"><rect x="3.5" y="8" width="17" height="12.5" rx="2"/><path d="M8.5 8V6a3.5 3.5 0 017 0v2M3.5 13h17"/></th:block>
    <th:block th:case="'cat-CLOTHING_ACCESSORIES'"><path d="M8.5 3L3 6.5l2 4 2.5-1V21h9V9.5l2.5 1 2-4L15.5 3c-.5 1.6-1.8 2.5-3.5 2.5S9 4.6 8.5 3z"/></th:block>
    <th:block th:case="'cat-KEYS'"><circle cx="8" cy="8" r="4.5"/><path d="M11.2 11.2L20 20M16 16l2-2M18 18l2-2"/></th:block>
    <th:block th:case="'cat-MONEY'"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9.5h.01M18 14.5h.01"/></th:block>
    <th:block th:case="'cat-OTHERS'"><path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/></th:block>
    <th:block th:case="*"><circle cx="12" cy="12" r="2"/></th:block>
</svg>
</body>
</html>
