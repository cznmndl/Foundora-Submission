# Tests use an in-memory database and never touch Supabase.
# (classpath:config/ overrides the main application.properties.)
# IGNORE_UNKNOWN_SETTINGS lets H2 accept the Postgres-only sslmode driver property.
spring.datasource.url=jdbc:h2:mem:foundora;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;IGNORE_UNKNOWN_SETTINGS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

foundora.supabase.url=http://supabase.test
foundora.supabase.secret-key=test-secret-key
