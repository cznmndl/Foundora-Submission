# Tests use an in-memory database and never touch Supabase.
# (classpath:config/ overrides the main application.properties.)
spring.datasource.url=jdbc:h2:mem:foundora;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

foundora.supabase.url=http://supabase.test
foundora.supabase.secret-key=test-secret-key
